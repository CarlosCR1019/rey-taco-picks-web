<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #030712;
  }

  .banner-container {
    width: 1080px;
    height: 1080px;
    background: radial-gradient(circle at 50% 8%, #1e1b4b 0%, #090c16 45%, #020617 100%);
    font-family: 'Outfit', sans-serif;
    color: #ffffff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 40px 50px;
  }

  /* Efecto estadio e iluminación dorada 3D */
  .bg-glow-gold {
    position: absolute;
    width: 700px;
    height: 500px;
    background: radial-gradient(circle, rgba(234, 179, 8, 0.22) 0%, rgba(34, 197, 94, 0.09) 50%, transparent 70%);
    top: -150px;
    left: 190px;
    filter: blur(50px);
    pointer-events: none;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(circle at center, black 50%, transparent 90%);
    pointer-events: none;
  }

  /* Marco exterior de oro 3D */
  .outer-frame {
    position: absolute;
    inset: 18px;
    border: 2px solid rgba(212, 175, 55, 0.45);
    border-radius: 26px;
    box-shadow: inset 0 0 30px rgba(234, 179, 8, 0.12), 0 0 25px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
    z-index: 10;
    height: 110px;
  }

  .brand-logo-img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 3px solid #facc15;
    box-shadow: 0 0 35px rgba(234, 179, 8, 0.5);
    object-fit: cover;
  }

  .header-text {
    text-align: left;
  }

  .brand-badge {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #facc15;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .main-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1;
    color: #FFFFFF;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .subtitle {
    font-size: 13px;
    color: #94a3b8;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 5px;
  }

  /* Grid de Cards */
  .cards-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 10;
    margin-top: 30px;
    margin-bottom: 30px;
  }

  .pick-card {
    height: 200px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(15, 23, 42, 0.92) 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    border-left: 8px solid #22c55e;
    border-radius: 22px;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(14px);
  }

  .pick-card.hot {
    border-left-color: #facc15;
    background: linear-gradient(135deg, rgba(234, 179, 8, 0.12) 0%, rgba(15, 23, 42, 0.95) 100%);
    border-color: rgba(234, 179, 8, 0.4);
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(234, 179, 8, 0.2);
  }

  .card-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 660px;
  }

  .meta-tags {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .tag-sport {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 6px;
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.4);
  }

  .tag-time {
    font-size: 13px;
    color: #94a3b8;
    font-weight: 700;
  }

  .match-title {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  .pick-selection {
    font-size: 24px;
    font-weight: 800;
    color: #facc15;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 14px rgba(234, 179, 8, 0.4);
  }

  .card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    min-width: 170px;
  }

  .odds-box {
    background: #0b1120;
    border: 2px solid rgba(34, 197, 94, 0.6);
    padding: 8px 24px;
    border-radius: 14px;
    text-align: right;
    box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
  }

  .odds-label {
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    color: #94a3b8;
    letter-spacing: 1.5px;
  }

  .odds-val {
    font-family: 'Montserrat', sans-serif;
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
    color: #22c55e;
  }

  .conf-badge {
    font-size: 13px;
    font-weight: 800;
    color: #22c55e;
    background: rgba(34, 197, 94, 0.15);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(34, 197, 94, 0.4);
  }

  /* Footer CTA */
  .footer {
    height: 70px;
    background: linear-gradient(90deg, rgba(234, 179, 8, 0.2) 0%, rgba(15, 23, 42, 0.95) 50%, rgba(234, 179, 8, 0.2) 100%);
    border: 1.5px solid rgba(234, 179, 8, 0.45);
    border-radius: 18px;
    padding: 0 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 10;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  }

  .footer-text {
    font-size: 17px;
    font-weight: 700;
    color: #f8fafc;
  }

  .footer-text span {
    color: #facc15;
    font-weight: 900;
  }

  .footer-url {
    background: #facc15;
    color: #090a16;
    font-weight: 900;
    font-size: 16px;
    padding: 10px 24px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(234, 179, 8, 0.5);
  }
</style>
</head>
<body>

<div class="banner-container" id="banner-root">
  <div class="bg-glow-gold"></div>
  <div class="bg-grid"></div>
  <div class="outer-frame"></div>

  <!-- Header con Logo Oficial -->
  <div class="header">
    <img src="../frontend/public/logo.jpg" class="brand-logo-img" alt="Rey Taco Picks" />
    <div class="header-text">
      <div class="brand-badge">REY TACO PICKS OFICIAL</div>
      <h1 class="main-title">PRON&Oacute;STICOS DEL D&Iacute;A</h1>
      <p class="subtitle" id="date-label">AN&Aacute;LISIS MATEM&Aacute;TICO &bull; INTELIGENCIA ARTIFICIAL</p>
    </div>
  </div>

  <!-- Cards -->
  <div class="cards-container" id="cards-wrapper">
    <!-- Inject dynamically -->
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">
      Desbloquea el <span>Análisis Premium</span> y la Cartera Completa
    </div>
    <div class="footer-url">reytacopicks.com</div>
  </div>
</div>

</body>
</html>
