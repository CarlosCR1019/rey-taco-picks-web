name: Rey Taco Telegram Mini App

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested read-only Telegram Mini App function
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rey-taco-telegram-mini-app
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://reytacopicks.com

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main

      - name: Verify Telegram Mini App contracts
        run: >-
          npx --yes deno@2.4.4 test --node-modules-dir=auto --allow-env
          supabase/functions/telegram-mini-app/index.test.ts

      - name: Validate deployment configuration
        if: ${{ inputs.deploy == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$TELEGRAM_BOT_TOKEN"

      - name: Configure protected function secrets
        if: ${{ inputs.deploy == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            SITE_URL="$SITE_URL"

      - name: Deploy only Telegram Mini App
        if: ${{ inputs.deploy == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 functions deploy telegram-mini-app \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify deployed function boundary
        if: ${{ inputs.deploy == true }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/telegram-mini-app"
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: $SITE_URL" \
            --header 'Access-Control-Request-Method: POST' \
            "$endpoint")"
          test "$status" = '204'

      - name: Validate signed Mini App request
        if: ${{ inputs.deploy == true }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          values = {
              "auth_date": str(int(time.time())),
              "query_id": "rey-taco-deploy-smoke",
              "user": json.dumps(
                  {"id": 9_007_199_254_740_000},
                  separators=(",", ":"),
              ),
          }
          check = "\n".join(f"{key}={values[key]}" for key in sorted(values))
          secret = hmac.new(b"WebAppData", token.encode(), hashlib.sha256).digest()
          values["hash"] = hmac.new(
              secret,
              check.encode(),
              hashlib.sha256,
          ).hexdigest()
          endpoint = (
              "https://"
              + os.environ["SUPABASE_PROJECT_REF"]
              + ".supabase.co/functions/v1/telegram-mini-app"
          )
          request = Request(
              endpoint,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Origin": os.environ["SITE_URL"],
              },
              data=json.dumps({"initData": urlencode(values)}).encode(),
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit("signed Mini App request was rejected")
              body = json.load(response)
          if body.get("linked") is not False or body.get("is_vip") is not False:
              raise SystemExit("smoke identity received unexpected access")
          if not isinstance(body.get("windows"), list) or len(body["windows"]) != 4:
              raise SystemExit("Mini App response contract is invalid")
          PY

      - name: Configure Telegram Mini App menu button
        if: ${{ inputs.deploy == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MINI_APP_URL: https://reytacopicks.com/?view=telegram
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          payload="$(jq --null-input --compact-output \
            --arg url "$MINI_APP_URL" \
            '{menu_button:{type:"web_app",text:"Abrir Rey Taco Picks",web_app:{url:$url}}}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$api/setChatMenuButton")"
          jq --exit-status '.ok == true and .result == true' <<< "$response" >/dev/null
          configured="$(curl --fail --silent --show-error "$api/getChatMenuButton")"
          jq --exit-status \
            --arg url "$MINI_APP_URL" \
            '.ok == true and .result.type == "web_app" and .result.web_app.url == $url' \
            <<< "$configured" >/dev/null
