name: Rey Taco Database Migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pending migrations after the mandatory dry-run
        required: true
        default: false
        type: boolean

concurrency:
  group: rey-taco-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate administrative configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Pin Supabase CLI
        shell: bash
        run: npx --yes supabase@2.115.0 --version

      - name: Link exact Supabase project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 db push --linked --dry-run \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        if: ${{ inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 db push --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Verify remote migration history
        if: ${{ inputs.apply == true }}
        shell: bash
        run: |
          npx --yes supabase@2.115.0 db push --linked --dry-run \
            --password "$SUPABASE_DB_PASSWORD"
