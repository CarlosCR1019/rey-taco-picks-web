<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #banner-root {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }
  body {
    background: #050814;
    color: #fff;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
  }
  #banner-root {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 56px 64px 48px;
    background-color: #050814;
    background-image:
      radial-gradient(circle at 20% 5%, rgba(240, 187, 45, .28), transparent 36%),
      linear-gradient(145deg, rgba(8, 16, 42, .86), rgba(4, 6, 16, .96));
    background-position: center;
    background-size: cover;
    isolation: isolate;
  }
  #banner-root::before {
    position: absolute;
    content: "";
    inset: 22px;
    border: 2px solid rgba(240, 187, 45, .68);
    border-radius: 28px;
    box-shadow: inset 0 0 32px rgba(240, 187, 45, .12);
    pointer-events: none;
    z-index: -1;
  }
  .header {
    height: 160px;
    display: flex;
    align-items: center;
    gap: 25px;
  }
  .logo {
    width: 126px;
    height: 126px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #f0bb2d;
    box-shadow: 0 0 34px rgba(240, 187, 45, .4);
  }
  .eyebrow {
    color: #f0bb2d;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3px;
  }
  h1 {
    font-size: 51px;
    line-height: 1.05;
    font-weight: 900;
    margin: 8px 0;
  }
  .date {
    color: #cbd5e1;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 1.5px;
  }
  .demo {
    height: 54px;
    margin: 18px 0 14px;
    border: 2px solid #ef4444;
    border-radius: 12px;
    color: #fff;
    background: rgba(127, 29, 29, .88);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .demo:empty { display: none; }
  .cards-container {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .pick-card {
    width: 100%;
    min-height: 515px;
    padding: 40px 42px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 2px solid rgba(240, 187, 45, .55);
    border-left: 10px solid #f0bb2d;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(15, 23, 42, .96), rgba(7, 12, 29, .93));
    box-shadow: 0 24px 52px rgba(0, 0, 0, .55);
  }
  .meta-row, .facts-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }
  .tag {
    border: 1px solid rgba(56, 189, 248, .48);
    border-radius: 8px;
    background: rgba(56, 189, 248, .12);
    color: #7dd3fc;
    padding: 8px 14px;
    font-size: 17px;
    font-weight: 850;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .schedule { color: #cbd5e1; font-size: 18px; font-weight: 750; }
  .event { font-size: 48px; line-height: 1.1; font-weight: 900; }
  .selection { color: #facc15; font-size: 39px; line-height: 1.15; font-weight: 900; }
  .odds {
    min-width: 190px;
    padding: 16px 22px;
    border: 2px solid rgba(34, 197, 94, .58);
    border-radius: 16px;
    background: #08101f;
  }
  .odds-label { color: #a7b0c2; font-size: 16px; font-weight: 800; text-transform: uppercase; }
  .odds-value { color: #22c55e; font-size: 53px; font-weight: 900; }
  .evidence { color: #e2e8f0; font-size: 19px; line-height: 1.45; text-align: right; }
  .value { color: #facc15; font-weight: 850; }
  .observation { color: #a7b0c2; font-size: 17px; }
  .footer {
    height: 102px;
    padding-top: 23px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 1px solid rgba(240, 187, 45, .42);
  }
  .site { color: #facc15; font-size: 25px; font-weight: 900; }
  .notice { color: #e2e8f0; font-size: 20px; font-weight: 750; text-align: right; }
</style>
</head>
<body>
<main id="banner-root" style="{{BACKGROUND_STYLE}}">
  <header class="header">
    <img class="logo" src="{{LOGO_DATA_URI}}" alt="Rey Taco Picks">
    <div>
      <div class="eyebrow">REY TACO PICKS OFICIAL</div>
      <h1>PICK P&Uacute;BLICO DEL D&Iacute;A</h1>
      <div class="date">{{DATE_LABEL}}</div>
    </div>
  </header>
  <div class="demo">{{DEMO_LABEL}}</div>
  <section class="cards-container">{{CARD_HTML}}</section>
  <footer class="footer">
    <div class="site">reytacopicks.com</div>
    <div class="notice">18+<br>Apuesta con responsabilidad</div>
  </footer>
</main>
</body>
</html>
