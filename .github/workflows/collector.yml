name: Rey Taco Residential Collector

on:
  schedule:
    # Mexico City is UTC-6. These preserve 10:00, 16:00 and 23:00 local runs.
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: rey-taco-residential-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect_primary:
    runs-on: [self-hosted, Windows, X64, playdoit-residential]
    timeout-minutes: 25
    outputs:
      recovery_label: ${{ steps.recovery_route.outputs.recovery_label }}
    env:
      PSExecutionPolicyPreference: Bypass
      REY_TACO_BROWSER_MODE: interactive
      SCRAPER_RUN_KEY: residential:${{ github.run_id }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: python -m pip install -r backend/requirements.txt

      - name: Collect and persist only
        shell: powershell
        run: |
          & python backend/scraper.py --collect-only
          $scraperStatus = $LASTEXITCODE
          if ($scraperStatus -in @(0, 3, 4)) {
            exit 0
          }
          exit $scraperStatus

      - name: Choose opposite recovery runner
        id: recovery_route
        if: always()
        shell: powershell
        run: |
          if ("${{ runner.name }}" -eq "rey-taco-carlos") {
            "recovery_label=rey-taco-respaldo" >> $env:GITHUB_OUTPUT
          } elseif ("${{ runner.name }}" -eq "rey-taco-respaldo") {
            "recovery_label=rey-taco-carlos" >> $env:GITHUB_OUTPUT
          } else {
            throw "Unknown residential runner name"
          }

  collect_recovery:
    needs: collect_primary
    if: failure()
    runs-on: [self-hosted, Windows, X64, playdoit-residential, "${{ needs.collect_primary.outputs.recovery_label }}"]
    timeout-minutes: 25
    env:
      PSExecutionPolicyPreference: Bypass
      REY_TACO_BROWSER_MODE: interactive
      SCRAPER_RUN_KEY: residential:${{ github.run_id }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: python -m pip install -r backend/requirements.txt

      - name: Collect and persist only
        shell: powershell
        run: |
          & python backend/scraper.py --collect-only
          $scraperStatus = $LASTEXITCODE
          if ($scraperStatus -in @(0, 3, 4)) {
            exit 0
          }
          exit $scraperStatus

  deliver_cloud:
    needs: [collect_primary, collect_recovery]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRAPER_RUN_KEY: residential:${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Deliver exact persisted batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_VIP_CHANNEL_ID: ${{ secrets.TELEGRAM_VIP_CHANNEL_ID }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
        run: python backend/scraper.py --deliver-only

      - name: Publish exact social batch
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: python -m backend.social_poster
