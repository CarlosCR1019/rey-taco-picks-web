name: Rey Taco Delivery Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original collector run ID to resume without duplicates
        required: true
        type: string
      portfolio_date:
        description: Mexico portfolio date (YYYY-MM-DD)
        required: true
        type: string

concurrency:
  group: rey-taco-delivery-recovery-${{ inputs.source_run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover_delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCRAPER_RUN_KEY: residential:${{ inputs.source_run_id }}
      DAILY_PORTFOLIO_ENABLED: 'true'
      DAILY_PORTFOLIO_DATE: ${{ inputs.portfolio_date }}

    steps:
      - name: Validate exact recovery target
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PORTFOLIO_DATE: ${{ inputs.portfolio_date }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$PORTFOLIO_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$(date --date="$PORTFOLIO_DATE" +%F)" == "$PORTFOLIO_DATE" ]]

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Resume exact persisted delivery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_VIP_CHANNEL_ID: ${{ secrets.TELEGRAM_VIP_CHANNEL_ID }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
        run: python backend/scraper.py --deliver-only

      - name: Resume exact social delivery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: python -m backend.social_poster
